name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Privacy guard
        run: |
          if grep -R --line-number 'android.permission.INTERNET' app/src/main; then
            echo 'INTERNET permission is forbidden'
            exit 1
          fi
      - name: Build
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: cie-nfc-poc-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
