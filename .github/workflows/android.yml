name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Resolve source SHA
        run: |
          SOURCE_SHA=$(jq -r 'if .pull_request then .pull_request.head.sha else env.GITHUB_SHA end' "$GITHUB_EVENT_PATH")
          echo "BUILD_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Checkout exact source SHA
        run: git checkout --detach "$BUILD_SHA"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Privacy guard source manifest
        run: |
          if grep -R --line-number 'android.permission.INTERNET' app/src/main | grep -v 'tools:node="remove"'; then
            echo 'Unexpected INTERNET permission in source'
            exit 1
          fi
          if grep -R --line-number 'android.permission.ACCESS_NETWORK_STATE' app/src/main | grep -v 'tools:node="remove"'; then
            echo 'Unexpected ACCESS_NETWORK_STATE permission in source'
            exit 1
          fi
      - name: Build
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Final APK permissions
        run: |
          AAPT2=$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n 1)
          echo "Using $AAPT2"
          "$AAPT2" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee /tmp/apk-permissions.txt
          echo "=== final uses-permission entries ==="
          grep 'uses-permission' /tmp/apk-permissions.txt || true
          if grep -q 'android.permission.INTERNET' /tmp/apk-permissions.txt; then
            echo 'INTERNET permission found in built APK'
            exit 1
          fi
          if grep -q 'android.permission.ACCESS_NETWORK_STATE' /tmp/apk-permissions.txt; then
            echo 'ACCESS_NETWORK_STATE permission found in built APK'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cie-nfc-poc-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
